services:
  dewbob-frontend-dev:
    image: registry.dewbob.com/dewbob/dewbob:dev
    container_name: dewbob-frontend-dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0

    ports:
      - "10.60.0.40:3000:3000"

    networks:
      - ubp-dev_backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ubp-dev_backend:
    external: true
