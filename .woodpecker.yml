when:
  branch: main
  event: [push, manual]

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: registry.dewbob.com
      repo: registry.dewbob.com/dewbob/dewbob
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: REGISTRY_USER
      password:
        from_secret: REGISTRY_PASS
      dockerfile: Dockerfile
      platforms: linux/amd64

  deploy-to-portainer:
    image: alpine/curl
    environment:
      PORTAINER_API_KEY:
        from_secret: PORTAINER_API_KEY
    commands:
      - |
        curl -X POST \
          -H "X-API-Key: ${PORTAINER_API_KEY}" \
          "https://stacks.dewbob.com/api/stacks/89/deploy?endpointId=7"
